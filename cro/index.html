<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<title>CRO Control Center · BYD Karebosi Connect</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--red:#D71920;--navy:#172B4D;--navy2:#0F1E38;--bg:#F3F5F8;--ink:#1E293B;--ink2:#475569;--muted:#64748B;--line:#E2E8F0;--ok:#0D9488;--ok-s:#E6F6F4;--warn:#D97706;--warn-s:#FEF3E2;--bad:#DC2626;--bad-s:#FDECEC;--blue:#2563EB;--blue-s:#EAF1FE;--vio:#7C3AED;--vio-s:#F3EEFE;--gray-s:#EEF2F7}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}
/* layout */
.side{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--navy);color:#fff;display:none;flex-direction:column;z-index:30}
.side .logo{padding:18px 18px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.mark{width:36px;height:36px;border-radius:10px;background:var(--red);display:grid;place-items:center;flex:none}
.logo b{display:block;font-size:13px;letter-spacing:.04em}.logo small{display:block;font-size:10px;color:#9FB0CC;letter-spacing:.1em}
.menu{padding:10px;overflow-y:auto;flex:1}
.menu a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#C8D3E6;text-decoration:none;font-weight:600;font-size:13px;margin-bottom:2px}
.menu a:hover{background:rgba(255,255,255,.06);color:#fff}
.menu a.on{background:rgba(255,255,255,.12);color:#fff}
.menu a .n{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:999px;padding:1px 7px}
.menu a .soon{margin-left:auto;font-size:10px;color:#9FB0CC;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:0 6px}
.side .tag{padding:14px 18px;font-size:11px;color:#9FB0CC;border-top:1px solid rgba(255,255,255,.08)}
.main{min-height:100vh;padding-bottom:76px}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{height:58px;display:flex;align-items:center;gap:10px;padding:0 14px}
.top h1{font-size:16px;margin:0;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .clock{font-size:12px;color:var(--muted);white-space:nowrap}
.top .me{margin-left:auto;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me .who{line-height:1.2}.me .who b{display:block;font-size:13px}.me .who small{color:var(--muted);font-size:11px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.iconbtn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.conn{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.conn i{width:7px;height:7px;border-radius:50%;background:#94A3B8}.conn.ok i{background:var(--ok)}.conn.bad i{background:var(--bad)}
.content{padding:14px;max-width:1280px;margin:0 auto}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 0;position:relative}
.bnav a.on{color:var(--red)}
.bnav a .n{position:absolute;top:0;right:22%;font-size:9px;background:var(--red);color:#fff;border-radius:999px;padding:0 5px}
@media(min-width:1024px){.side{display:flex}.main{margin-left:248px;padding-bottom:20px}.bnav{display:none}.mob{display:none!important}.content{padding:22px}}
@media(max-width:1023px){.desk{display:none!important}}
@media(max-width:560px){.me .who,.top .clock{display:none}}
/* drawer menu mobile */
.mdrawer{position:fixed;inset:0;z-index:50;display:none}.mdrawer.on{display:block}
.mdrawer .sc{position:absolute;inset:0;background:rgba(15,30,56,.45)}
.mdrawer .pn{position:absolute;left:0;top:0;bottom:0;width:min(290px,85%);background:var(--navy);display:flex;flex-direction:column;animation:sl .2s}
@keyframes sl{from{transform:translateX(-20px);opacity:0}}
/* components */
.card{background:#fff;border-radius:16px;border:1px solid #E9EDF3;padding:16px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.ch h3{margin:0;font-size:15px;color:var(--navy)}
.ch small{color:var(--muted);font-size:12px}
.grid{display:grid;gap:12px}
.g2{display:grid;gap:12px}@media(min-width:900px){.g2{grid-template-columns:1fr 1fr}}
.g3{display:grid;gap:12px}@media(min-width:1100px){.g3{grid-template-columns:2fr 1fr}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid #E9EDF3;border-radius:16px;padding:14px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.kpi.ok::before{background:var(--ok)}.kpi.warn::before{background:var(--warn)}.kpi.bad::before{background:var(--bad)}
.kpi .l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-height:28px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:600}
.kpi .d{font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.delta{font-weight:700}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}.delta.flat{color:var(--muted)}
.kpi .na{font-size:12px;color:var(--warn);font-weight:600;margin-top:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 11px;border-radius:9px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--navy);color:#fff}
.in,.sel{padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:13px;min-width:0}
.in:focus,.sel:focus{outline:none;border-color:var(--navy)}
textarea.in{min-height:84px;resize:vertical;width:100%}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:13px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn-p{background:var(--red);color:#fff}.btn-n{background:var(--navy);color:#fff}.btn-g{background:#fff;border:1.5px solid var(--line)}.btn-wa{background:#1FA855;color:#fff}.btn-r{background:#fff;border:1.5px solid #F5C2C2;color:var(--bad)}
.att{display:grid;gap:8px}
.ai{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);cursor:pointer;background:#fff;text-align:left;width:100%}
.ai:hover{border-color:#CBD5E1}
.ai .b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.ai.c .b{background:var(--bad-s);color:var(--bad)}.ai.w .b{background:var(--warn-s);color:var(--warn)}.ai.g .b{background:var(--ok-s);color:var(--ok)}
.ai b{font-size:13px}.ai span{font-size:12px;color:var(--muted);display:block}
.ai .go{margin-left:auto;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.s-NEW,.s-REOPENED{background:var(--bad-s);color:var(--bad)}.s-ASSIGNED{background:var(--blue-s);color:var(--blue)}.s-IN_PROGRESS{background:#E3F3F5;color:#0A5F6B}
.s-WAIT_CUSTOMER{background:var(--warn-s);color:var(--warn)}.s-WAIT_INTERNAL{background:var(--vio-s);color:var(--vio)}.s-RESOLVED{background:var(--ok-s);color:var(--ok)}.s-CLOSED{background:var(--gray-s);color:var(--muted)}
.demo{background:#FFF7E6;color:#92400E;border:1px dashed #F5B94A;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.06em}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid #F1F5F9;vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#F8FAFC}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.list{display:grid;gap:8px}
.tk{background:#fff;border:1px solid #E9EDF3;border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;width:100%}
.tk:hover{border-color:#CBD5E1}
.tk .code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
.tk .nm{font-weight:700}
.tk .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.tk .flag{color:var(--bad);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--ink2)}
.chip b{color:var(--muted);margin-left:3px}.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}.chip.on b{color:#C8D3E6}
.empty{text-align:center;color:var(--muted);padding:34px 10px;border:1.5px dashed #CBD5E1;border-radius:14px;background:#fff}
.notice{background:var(--warn-s);color:#7A4A06;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.notice b{color:inherit}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:130px 1fr 34px;gap:8px;align-items:center;font-size:12px}
.bar .t{height:10px;background:var(--gray-s);border-radius:6px;overflow:hidden}.bar .t i{display:block;height:100%;border-radius:6px;background:var(--navy)}
.bar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.lg{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:6px}.lg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,#EEF2F7,#E2E8F0,#EEF2F7);background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 0}@keyframes sk{to{background-position:-200% 0}}
label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.f{margin-bottom:10px}.f .in,.f .sel{width:100%}
.msg{font-size:12px;margin-top:6px;min-height:16px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
/* drawer ticket */
.scrim{position:fixed;inset:0;background:rgba(15,30,56,.45);z-index:60;display:none}.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:61;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.dh .x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:0;background:var(--gray-s);font-size:18px;cursor:pointer}
.db{overflow-y:auto;padding:12px 14px 40px;display:grid;gap:10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.quick button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;font-size:12px;cursor:pointer}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tl li{display:grid;grid-template-columns:10px 1fr;gap:10px;font-size:13px}
.tl li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--navy);margin-top:6px}
.tl .t{font-size:11px;color:var(--muted)}
.confirm{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(15,30,56,.5);padding:20px}.confirm.on{display:grid}
.confirm .box{background:#fff;border-radius:18px;padding:20px;max-width:380px;width:100%}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#172B4D,#0F1E38)}
.login .card{width:100%;max-width:380px;padding:24px}
.qrbox{background:#fff;border-radius:14px;padding:16px;display:inline-block}
.poster{background:var(--navy);color:#fff;border-radius:18px;padding:22px;text-align:center;max-width:340px;margin:0 auto}
.poster .k{font-size:11px;letter-spacing:.12em;color:#9FB0CC;font-weight:700}.poster h3{font-size:22px;margin:8px 0 4px}.poster p{color:#C8D3E6;font-size:13px;margin:0 0 14px}
svg.chart{width:100%;height:auto;display:block}
@media(max-width:1099px){#att{order:-1}.g3>.grid{display:contents}}
@media print{.side,.bnav,.top,.filters,#xk,#xt,#xp{display:none!important}.main{margin:0}body{background:#fff}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:90;display:none}.toast.on{display:block}
</style>
</head>
<body>

<section class="login" id="login-view">
  <div class="card">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px"><span class="mark" style="color:#fff"><svg class="i" viewBox="0 0 24 24"><path d="M5 16h14l-1.6-6.2A2 2 0 0 0 15.5 8.3h-7a2 2 0 0 0-1.9 1.5Z"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg></span><div><b style="color:var(--navy)">CRO CONTROL CENTER</b><div style="font-size:11px;color:var(--muted);letter-spacing:.08em">PUSAT KENDALI AFTERSALES</div></div></div>

  </div>
</section>

<div id="app" class="hide">
<aside class="side" id="side"></aside>
<div class="mdrawer" id="mdrawer"><div class="sc" data-mclose></div><div class="pn" id="mpanel"></div></div>
<div class="main">
  <header class="top"><div class="in">

    </div>
  </div></header>
  <div class="content" id="content"></div>
</div>
<nav class="bnav" id="bnav"></nav>
</div>

<div class="scrim" id="scrim"></div>

</aside>
<div class="confirm" id="confirm"><div class="box"><b id="cf-title" style="font-size:16px;color:var(--navy)"></b><p id="cf-text" style="color:var(--ink2);font-size:13px"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-g" id="cf-no">Batal</button><button class="btn btn-p" id="cf-yes">Ya, lanjutkan</button></div></div></div>

function api(action,data){
  var body=Object.assign({},data||{},{action:action,token:token});
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)})
    .then(function(r){return r.json();}).catch(function(){return {ok:false,error:"network"};})
    .then(function(res){res=res||{ok:false,error:"network"};if(res.error==="unauthorized"&&action!=="login")doLogout(true);return res;});

function doLogin(){
  var m=$("#l-msg"),b=$("#l-btn"),nama=$("#l-nama").value.trim(),pin=$("#l-pin").value.trim();
  if(!nama||!/^\d{6}$/.test(pin)){setMsg(m,false,"Isi nama dan PIN 6 digit.");return;}

  api("login",{nama:nama,pin:pin}).then(function(r){

    token=r.token;lsSet("cro_token",token);lsSet("cro_nama",nama);$("#l-pin").value="";setMsg(m,null,"");startApp(r.me);

/* ---------- KPI ---------- */
function kpiSet(r){
  var T=scoped(r);
  var contacted=new Set(T.filter(function(t){return t.firstResponseAt;}).map(function(t){return t.phone;})).size;
  var book=T.filter(function(t){return t.category==="Booking servis";}).length;
  var open=tickets.filter(function(t){return t.status!=="CLOSED"&&(!F.cro||t.pic===F.cro)&&(!F.cat||t.category===F.cat);}).length;
  var comp=T.filter(function(t){return t.category!=="Masukan pelanggan"&&t.resolvedAt;});
  var avgRes=comp.length?comp.reduce(function(a,t){return a+(t.resolvedAt-t.createdAt);},0)/comp.length:null;
  var over=tickets.filter(function(t){return isOver(t)&&(!F.cro||t.pic===F.cro)&&(!F.cat||t.category===F.cat);}).length;
  var fbs=T.filter(function(t){return t.category==="Masukan pelanggan";}).map(fb).filter(function(x){return x.svc;});
  var csat=fbs.length?fbs.reduce(function(a,x){return a+x.svc;},0)/fbs.length:null;
  var sched=T.reduce(function(a,t){return a+(+t.sched||0);},0),ontime=T.reduce(function(a,t){return a+(+t.ontime||0);},0);
  var fu=sched?ontime/sched:null;
  return {contacted:contacted,book:book,open:open,avgRes:avgRes,nRes:comp.length,over:over,csat:csat,nFb:fbs.length,fu:fu,sched:sched,ontime:ontime,n:T.length};
}
function delta(cur,prev,goodUp){
  if(cur==null||prev==null)return '<span class="delta flat">— vs periode lalu</span>';
  if(prev===0&&cur===0)return '<span class="delta flat">= periode lalu</span>';
  var diff=cur-prev,up=diff>0,good=goodUp?up:!up;
  if(diff===0)return '<span class="delta flat">= periode lalu</span>';
  var pct=prev?Math.round(Math.abs(diff)/Math.abs(prev)*100)+"%":"baru";
  return '<span class="delta '+(good?"up":"down")+'">'+(up?"▲":"▼")+" "+pct+'</span> vs periode lalu';
}
function kpiCards(){
  var r=range(),len=r[1]-r[0],pr=[r[0]-len,r[0]],k=kpiSet(r),p=kpiSet(pr);
  var pct=function(x){return x==null?"–":Math.round(x*100)+"%";};
  var cards=[
   ["Pelanggan dihubungi",k.contacted,"",delta(k.contacted,p.contacted,true),"","Pelanggan unik dengan respons pertama tercatat"],
   ["Booking servis",k.book,"",delta(k.book,p.book,true),"","Tiket kategori Booking servis"],

   ["Kasus terbuka",k.open,"",'<span class="delta flat">saat ini</span>',k.open?"warn":"ok","Semua tiket belum Closed"],
   ["Rata-rata penyelesaian",fmtDur(k.avgRes),"",delta(k.avgRes,p.avgRes,false),"",k.nRes+" tiket selesai"],

   ["Kepuasan pelanggan",k.csat==null?"–":k.csat.toFixed(1).replace(".",","),k.csat==null?"":"/5",delta(k.csat,p.csat,true),k.csat==null?"":(k.csat>=4?"ok":k.csat>=3?"warn":"bad"),k.nFb+" respons valid"],
   ["Follow-up tepat waktu",pct(k.fu),"",delta(k.fu,p.fu,true),k.fu==null?"":(k.fu>=.9?"ok":k.fu>=.7?"warn":"bad"),k.ontime+" dari "+k.sched+" update terjadwal"]

  return '<div class="kpis">'+cards.map(function(c){return '<div class="kpi '+c[4]+'"><div class="l">'+c[0]+'</div><div class="v">'+c[1]+(c[2]?'<small>'+c[2]+'</small>':'')+'</div><div class="d">'+c[3]+'</div>'+(c[5].indexOf("<div")===0?c[5]:'<div class="d" style="margin-top:4px">'+c[5]+'</div>')+'<div class="d" style="margin-top:2px">Target: <i>belum ditetapkan</i></div></div>';}).join("")+'</div>';
}

/* ---------- charts (svg) ---------- */
function days(r){var out=[],s=new Date(new Date(r[0]).toLocaleDateString("en-CA",{timeZone:TZ})+"T00:00:00+08:00").getTime();for(var t=s;t<=r[1];t+=864e5)out.push(t);if(out.length>45)out=out.slice(-45);return out;}
function lineChart(series,labels){
  var W=640,H=200,pl=30,pb=24,pt=10,pr=10,max=Math.max(1,Math.max.apply(null,series.reduce(function(a,s){return a.concat(s.v);},[])));max=Math.ceil(max/4)*4;
  var n=labels.length,x=function(i){return pl+(n<2?0:i*(W-pl-pr)/(n-1));},y=function(v){return pt+(H-pt-pb)*(1-v/max);};
  var g='';for(var k=0;k<=4;k++){var yy=pt+(H-pt-pb)*k/4;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="#EEF2F7"/><text x="'+(pl-6)+'" y="'+(yy+4)+'" font-size="10" text-anchor="end" fill="#94A3B8">'+Math.round(max*(1-k/4))+'</text>';}
  var step=Math.ceil(n/8),lab='';labels.forEach(function(l,i){if(i%step===0||i===n-1)lab+='<text x="'+x(i)+'" y="'+(H-6)+'" font-size="10" text-anchor="middle" fill="#94A3B8">'+l+'</text>';});
  var lines=series.map(function(s){return '<polyline fill="none" stroke="'+s.c+'" stroke-width="2.2" stroke-linejoin="round" points="'+s.v.map(function(v,i){return x(i)+","+y(v);}).join(" ")+'"/>'+s.v.map(function(v,i){return v?'<circle cx="'+x(i)+'" cy="'+y(v)+'" r="2.6" fill="'+s.c+'"><title>'+labels[i]+': '+v+'</title></circle>':'';}).join("");}).join("");
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+g+lab+lines+'</svg><div class="lg">'+series.map(function(s){return '<span><i style="background:'+s.c+'"></i>'+s.n+'</span>';}).join("")+'</div>';
}
function bars(pairs,color){var max=Math.max.apply(null,[1].concat(pairs.map(function(p){return p[1];})));return pairs.length?'<div class="bars">'+pairs.map(function(p){return '<div class="bar"><span>'+esc(p[0])+'</span><span class="t"><i style="width:'+(p[1]/max*100).toFixed(1)+'%;background:'+(p[2]||color||"var(--navy)")+'"></i></span><span class="n">'+p[1]+'</span></div>';}).join("")+'</div>':'<div class="empty" style="padding:18px">Belum ada data di periode ini.</div>';}
function count(arr,f){var m=new Map();arr.forEach(function(x){var k=f(x);m.set(k,(m.get(k)||0)+1);});return Array.from(m.entries()).sort(function(a,b){return b[1]-a[1];});}

function act(t,action,data,sel,okText){
  if(busy.has(t.id))return;busy.add(t.id);var m=$(sel);setMsg(m,null,"Menyimpan…");
  api(action,Object.assign({id:t.id},data)).then(function(r){busy.delete(t.id);if(!r.ok){setMsg($(sel),false,errText(r));return;}if(r.nochange){setMsg($(sel),null,"Tidak ada perubahan.");return;}drawerFor=null;upsert(r.ticket);renderDrawer();setMsg($(sel),true,okText);loadLog(t.id);});
}
var cfCb=null;
function confirmBox(title,text,cb){$("#cf-title").textContent=title;$("#cf-text").textContent=text;cfCb=cb;$("#confirm").classList.add("on");}
$("#cf-no").addEventListener("click",function(){$("#confirm").classList.remove("on");});
$("#cf-yes").addEventListener("click",function(){$("#confirm").classList.remove("on");if(cfCb)cfCb();});

/* boot */
(function(){if(!token){$("#login-view").classList.remove("hide");return;}$("#login-view").classList.add("hide");api("me").then(function(r){if(r.ok)startApp(r.me);else $("#login-view").classList.remove("hide");});})();
})();
</script>
