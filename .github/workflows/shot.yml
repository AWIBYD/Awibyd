name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot
          curl -s -o /dev/null --max-time 30 "https://byd-makassar.id/?awi_purge=ea25bc517ab6c5a7&x=$(date +%s)"; sleep 3
          for s in model/byd-atto-2 model/byd-ti7 model/byd-denza-z9-gt model/byd-atto-3 model/byd-sealion-7; do
            echo "== $s" >> tmp-upload/shot/t.txt
            curl -s -A "Mozilla/5.0 (compatible; Googlebot/2.1)" "https://byd-makassar.id/$s/?v=$(date +%s)" | grep -o -E '<title>[^<]*</title>|<meta property="og:title"[^>]*>|<meta name="description"[^>]*>' >> tmp-upload/shot/t.txt
          done
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
