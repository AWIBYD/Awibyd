name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot /tmp/pw && cd /tmp/pw && npm i playwright-core@1.47.2 >/dev/null 2>&1
          cd $GITHUB_WORKSPACE && node tmp-upload/audit/cls.js || true
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
