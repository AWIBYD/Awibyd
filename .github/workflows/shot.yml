name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot && cd tmp-upload/shot
          for u in 2026/05/awi-nyd-makassar.jpg 2025/11/byd-slide-2.webp 2026/11/awi-sales-consultant-byd-makassar.webp 2026/11/awi-welcome-sales-byd-makassar.webp; do curl -s -O "https://byd-makassar.id/wp-content/uploads/$u"; done
          curl -s "https://byd-makassar.id/?v=$(date +%s)" -o /tmp/h.html
          grep -o -E '<img[^>]*(awi|slide-2|nyd|avatar)[^>]*>|url\([^)]*(awi|slide-2|nyd)[^)]*\)' /tmp/h.html | sed -E 's/srcset="[^"]*"//g' | sort | uniq -c > home.txt
          for s in welcome jelajah; do :; done
          cd ../..
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
