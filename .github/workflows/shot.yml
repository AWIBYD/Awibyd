name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot
          mkdir -p /tmp/pw && cd /tmp/pw && npm i playwright-core@1.47.2 >/dev/null
          cat > s.js <<'J'
          const {chromium}=require('/tmp/pw/node_modules/playwright-core');const W=process.env.GITHUB_WORKSPACE+'/tmp-upload/shot/';const fs=require('fs');const log=s=>fs.appendFileSync(W+'t.txt',s+'\n');
          (async()=>{const b=await chromium.launch({executablePath:'/usr/bin/google-chrome'});
          const ctx=await b.newContext({viewport:{width:390,height:844}});
          const p=await ctx.newPage();
          p.on('request',r=>{const u=r.url();if(/google-analytics\.com|googleadservices|doubleclick|googletagmanager\.com\/gtag\/js|google\.com\/(ccm|pagead)/.test(u)){let x=u;try{const q=new URL(u);x=q.hostname+q.pathname+' tid='+(q.searchParams.get('tid')||q.searchParams.get('id')||'')+' en='+(q.searchParams.get('en')||'')+' label='+(q.searchParams.get('label')||'')}catch(e){};log('REQ '+r.method()+' '+x+(r.postData()?' BODY '+r.postData().slice(0,300):''));}});
          await p.goto('https://byd-makassar.id/model/byd-atto-1/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});await p.waitForTimeout(3000);
          log('---- CLICK WA ----');
          await p.evaluate(()=>{document.querySelectorAll('a[href*="wa.me"]').forEach(a=>a.addEventListener('click',ev=>ev.preventDefault()))});
          const a=await p.$('a[href*="wa.me"]');await a.evaluate(x=>x.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})));
          await p.waitForTimeout(6000);
          const dl=await p.evaluate(()=>JSON.stringify((window.dataLayer||[]).map(x=>Array.from(x).slice(0,2)).slice(-12)));log('DL '+dl);
          await b.close()})();
          J
          node s.js || true
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
