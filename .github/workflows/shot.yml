name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot
          curl -s -o /dev/null --max-time 30 "https://byd-makassar.id/?awi_purge=ea25bc517ab6c5a7&x=$(date +%s)"; sleep 3
          UA="Mozilla/5.0 (Linux; Android 14) Chrome/120 Mobile Safari/537.36"
          while read u; do echo "$(curl -s -o /dev/null -A "$UA" -w '%{http_code} %{redirect_url}' --max-time 20 "$u?v=$(date +%s)") $u"; done < tmp-upload/u404.txt > tmp-upload/shot/status.txt
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
