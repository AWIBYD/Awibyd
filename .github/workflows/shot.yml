name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot
          curl -s --max-time 40 "https://byd-makassar.id/?awi_wpc=k93hf2xq&x=$(date +%s)" > tmp-upload/shot/t.txt; echo >> tmp-upload/shot/t.txt
          curl -s -o /dev/null --max-time 30 "https://byd-makassar.id/?awi_purge=ea25bc517ab6c5a7&x=$(date +%s)"; sleep 4
          for s in "" model/byd-atto-1/ simulasi-kredit/ jelajah/; do echo "== $s" >> tmp-upload/shot/t.txt; curl -s "https://byd-makassar.id/$s?v=$(date +%s)" | grep -o -E "LABEL_DISINI|klik_whatsapp|konversi WA lewat event GA4|gtag\('config', 'AW-17836993296'\)" | sort | uniq -c >> tmp-upload/shot/t.txt; done
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
