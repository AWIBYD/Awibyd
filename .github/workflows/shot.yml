name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot
          curl -s -o /dev/null --max-time 30 "https://byd-makassar.id/?awi_purge=ea25bc517ab6c5a7&x=$(date +%s)"; sleep 4
          for s in "" model/byd-atto-1/ simulasi-kredit/; do echo "== $s" >> tmp-upload/shot/t.txt; curl -s "https://byd-makassar.id/$s?v=$(date +%s)" | grep -o -E "clarity\.ms/tag/[\"+]*|zckwfj3dsn|zckkorh0jl" | sort | uniq -c >> tmp-upload/shot/t.txt; done
          mkdir -p /tmp/pw && cd /tmp/pw && npm i playwright-core@1.47.2 >/dev/null
          cat > s.js <<'J'
          const {chromium}=require('/tmp/pw/node_modules/playwright-core');const fs=require('fs');const log=s=>fs.appendFileSync(process.env.GITHUB_WORKSPACE+'/tmp-upload/shot/t.txt',s+'\n');
          (async()=>{const b=await chromium.launch({executablePath:'/usr/bin/google-chrome'});const p=await b.newPage();
          p.on('response',r=>{if(/clarity\.ms/.test(r.url()))log('CL '+r.status()+' '+r.url().slice(0,80));});
          await p.goto('https://byd-makassar.id/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});await p.mouse.wheel(0,1500);await p.waitForTimeout(6000);
          log('clarity fn: '+await p.evaluate(()=>typeof window.clarity));await b.close()})();
          J
          node s.js || true
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
