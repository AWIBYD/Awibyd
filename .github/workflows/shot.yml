name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot
          curl -s -o /dev/null --max-time 30 "https://byd-makassar.id/?awi_purge=ea25bc517ab6c5a7&x=$(date +%s)"; sleep 4
          curl -s "https://byd-makassar.id/model/byd-atto-1/?v=$(date +%s)" -o /tmp/p.html
          grep -o -E 'byd-atto-1-detail-[a-z-]*\.(mp4|webp)|Detail Eksterior[^<]*|GIIAS|youtube|model__leftvideo' /tmp/p.html | sort | uniq -c > tmp-upload/shot/t.txt
          curl -s -I "https://byd-makassar.id/wp-content/uploads/2026/11/byd-atto-1-detail-eksterior-interior.mp4" | grep -i -E "^HTTP|content-length|content-type" >> tmp-upload/shot/t.txt
          mkdir -p /tmp/pw && cd /tmp/pw && npm i playwright-core@1.47.2 >/dev/null
          cat > s.js <<'J'
          const {chromium}=require('/tmp/pw/node_modules/playwright-core');
          (async()=>{const b=await chromium.launch({executablePath:'/usr/bin/google-chrome'});
          const p=await b.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
          await p.goto('https://byd-makassar.id/model/byd-atto-1/?v='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForTimeout(3000);
          const v=await p.$('video[src*="detail-eksterior"]');
          if(v){await v.scrollIntoViewIfNeeded();await p.waitForTimeout(2500);
          const box=await p.evaluateHandle(e=>e.closest('div[style*="radial-gradient"]'),v);
          await box.asElement().screenshot({path:process.env.GITHUB_WORKSPACE+'/tmp-upload/shot/block.png'});}
          require('fs').appendFileSync(process.env.GITHUB_WORKSPACE+'/tmp-upload/shot/t.txt','video found: '+!!v+'\n');
          await b.close()})();
          J
          node s.js || true
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
