name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot
          for u in https://bydhakamakassar.id/car-byd-sealion-7 https://bydhakamakassar.id/car-byd-seal https://bydhakamakassar.id/car-byd-atto-1 https://bydhakamakassar.id/tes-drive https://bydhakamakassar.id/daftar-harga https://bydhakamakassar.id/car-byd-m6 https://bydhakamakassar.id/car-denza-d9 https://bydhakamakassar.id/car-denza-b5 https://bydhakamakassar.id/kontak https://www.bydhakamakassar.id https://bydhakamakassar.id/car-byd-atto-3 https://byd-makassar.id/model/byd-atto-3/ https://byd-makassar.id/model/byd-m6-dm/ https://byd-makassar.id/model/byd-m6/ https://byd-makassar.id/model/byd-sealion-7/ https://byd-makassar.id/model/byd-seal/ https://byd-makassar.id/test-drive/ https://byd-makassar.id/harga-byd-makassar/ https://www.byd-makassar.id/model/byd-denza-d9/ https://byd-makassar.id/model/byd-atto-1/ https://byd-makassar.id/kontak/ https://byd-makassar.id/kalkulator-hemat/ https://byd-makassar.id/model/byd-atto-2/ https://byd-makassar.id/model/byd-ti7/; do
            r=$(curl -s -o /tmp/b -w "%{http_code} %{url_effective} %{num_redirects}" -L --max-time 25 -A "Mozilla/5.0 (compatible; AdsBot-Google; +http://www.google.com/adsbot.html)" "$u"); t=$(grep -o '<title>[^<]*' /tmp/b | head -1 | cut -c8-80); echo "$u => $r | $t" >> tmp-upload/shot/sl.txt; done
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
