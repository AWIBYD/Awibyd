name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot
          curl -s -o /dev/null --max-time 30 "https://byd-makassar.id/?awi_purge=ea25bc517ab6c5a7&x=$(date +%s)"; sleep 4
          for s in "" model/byd-atto-1/ atto-1-vs-brio-makassar/ simulasi-kredit/ spklu-makassar/ jelajah/; do
            curl -s "https://byd-makassar.id/$s?v=$(date +%s)" -o /tmp/p.html
            echo "== $s" >> tmp-upload/shot/t.txt
            grep -o -E 'awi-nyd-makassar[^"]*|awi-sales-byd-makassar-studio|awi-sales-byd-makassar-avatar|awi-sales-consultant-byd-makassar-profil[-0-9]*|awi-sales-byd-makassar-3d-full|gravatar' /tmp/p.html | sort | uniq -c >> tmp-upload/shot/t.txt
          done
          mkdir -p /tmp/pw && cd /tmp/pw && npm i playwright-core@1.47.2 >/dev/null
          cat > s.js <<'J'
          const {chromium}=require('/tmp/pw/node_modules/playwright-core');const W=process.env.GITHUB_WORKSPACE+'/tmp-upload/shot/';
          (async()=>{const b=await chromium.launch({executablePath:'/usr/bin/google-chrome'});
          const p=await b.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
          await p.goto('https://byd-makassar.id/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});await p.waitForTimeout(1500);
          const w=await p.$('#awi-wel');if(w){await w.screenshot({path:W+'welcome.png'}).catch(()=>{});}
          await p.evaluate(()=>{const e=document.getElementById('awi-wel');if(e)e.remove();document.querySelectorAll('img[data-src]').forEach(i=>{i.src=i.dataset.src})});
          const c=await p.$('img[alt="AWI, Sales Consultant resmi BYD Haka Karebosi Makassar"]');if(c){await c.scrollIntoViewIfNeeded();await p.waitForTimeout(2500);const box=await p.evaluateHandle(x=>x.closest('div[style*="linear-gradient"]'),c);await box.asElement().screenshot({path:W+'cta.png'});}
          const q=await b.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
          await q.goto('https://byd-makassar.id/jelajah/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});
          const ph=await q.$('img[src*="3d-full"]');if(ph){await ph.scrollIntoViewIfNeeded();await q.waitForTimeout(2000);await q.screenshot({path:W+'jelajah_ph.png'});}
          await b.close()})();
          J
          node s.js || true
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
