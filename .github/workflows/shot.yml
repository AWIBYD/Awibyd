name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot /tmp/pw && cd /tmp/pw && npm i playwright-core@1.47.2 lighthouse@12.2.1 >/dev/null 2>&1
          curl -s -o /dev/null --max-time 30 "https://byd-makassar.id/?awi_purge=ea25bc517ab6c5a7&x=$(date +%s)"; sleep 5
          for u in "" model/byd-atto-1/ simulasi-kredit/ spklu-makassar/; do curl -s -o /dev/null "https://byd-makassar.id/$u"; done
          cd $GITHUB_WORKSPACE && node tmp-upload/audit/verify.js || true
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
