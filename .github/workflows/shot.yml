name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot
          curl -s -o /dev/null --max-time 30 "https://byd-makassar.id/?awi_purge=ea25bc517ab6c5a7&x=$(date +%s)"; sleep 4
          for s in spklu-makassar "" kalkulator-charging-byd; do
            echo "== $s" >> tmp-upload/shot/t.txt
            curl -s -o /tmp/p.html -w "%{http_code}\n" "https://byd-makassar.id/$s/?v=$(date +%s)" >> tmp-upload/shot/t.txt
            grep -o -E '<title>[^<]*</title>|<meta name="description"[^>]*>|spklu-makassar/[^"]*"|"FAQPage"|id="spkmap"|<link rel="canonical"[^>]*>' /tmp/p.html | sort | uniq -c >> tmp-upload/shot/t.txt
          done
          mkdir -p /tmp/pw && cd /tmp/pw && npm i playwright-core@1.47.2 >/dev/null
          cat > s.js <<'J'
          const {chromium}=require('/tmp/pw/node_modules/playwright-core');
          (async()=>{const b=await chromium.launch({executablePath:'/usr/bin/google-chrome'});
          const p=await b.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});const errs=[];p.on('pageerror',e=>errs.push(e.message));
          await p.goto('https://byd-makassar.id/spklu-makassar/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});
          await p.evaluate(()=>{const m=document.getElementById('spkmap');m&&m.scrollIntoView()});await p.waitForTimeout(6000);
          const r=await p.evaluate(()=>[document.querySelectorAll('.leaflet-interactive').length,document.querySelectorAll('#spkl .card').length,document.documentElement.scrollWidth,innerWidth]);
          require('fs').appendFileSync(process.env.GITHUB_WORKSPACE+'/tmp-upload/shot/t.txt','live: markers,cards,sw,w='+JSON.stringify(r)+' errs='+JSON.stringify(errs)+'\n');
          await p.evaluate(()=>window.scrollTo(0,0));await p.waitForTimeout(800);
          await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/tmp-upload/shot/live.png'});
          const el=await p.$('#peta');if(el)await el.screenshot({path:process.env.GITHUB_WORKSPACE+'/tmp-upload/shot/peta.png'});
          await b.close()})();
          J
          node s.js || true
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
