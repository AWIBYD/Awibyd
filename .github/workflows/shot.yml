name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot
          for s in "" model/byd-atto-1 atto-1-vs-brio-makassar simulasi-kredit test-drive spklu-makassar kalkulator-hemat harga-byd-makassar jelajah; do
            curl -s "https://byd-makassar.id/$s/?v=$(date +%s)" -o /tmp/p.html
            echo "== $s" >> tmp-upload/shot/t.txt
            grep -o -E '<img[^>]*(awi|slide-2|nyd|sales|avatar|gravatar)[^>]*>|url\([^)]*(awi|slide-2|nyd)[^)]*\)|"[^"]*(awi-|slide-2|nyd)[^"]*\.(webp|jpg|png|jpeg)"' /tmp/p.html | sed -E 's/srcset="[^"]*"//g' | sort | uniq -c >> tmp-upload/shot/t.txt
          done
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
