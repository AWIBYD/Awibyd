name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot
          curl -sL -A "Mozilla/5.0 (Linux; Android 13) Chrome/120 Mobile Safari/537.36" "https://byd-makassar.id/kalkulator-hemat/?v=$(date +%s)" -o tmp-upload/shot/kh.html
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
