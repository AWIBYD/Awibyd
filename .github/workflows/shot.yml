name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot
          for s in "" model/byd-atto-1/ simulasi-kredit/; do
            curl -s "https://byd-makassar.id/$s?v=$(date +%s)" -o /tmp/p.html
            echo "== $s" >> tmp-upload/shot/t.txt
            grep -o -E "G-[A-Z0-9]{8,12}|GTM-[A-Z0-9]{5,8}|AW-[0-9]{9,12}(/[A-Za-z0-9_-]+)?|clarity|fbq\(|ttq\.|gtag\('config'[^)]*\)|wa\.me/[0-9]+|api\.whatsapp\.com|dari halaman|send_to[^,}]*" /tmp/p.html | sort | uniq -c >> tmp-upload/shot/t.txt
          done
          curl -s "https://byd-makassar.id/simulasi-kredit/?v=$(date +%s)" -o tmp-upload/shot/kredit.html
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
