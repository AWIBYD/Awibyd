name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot
          curl -s -o /dev/null --max-time 30 "https://byd-makassar.id/?awi_purge=ea25bc517ab6c5a7&x=$(date +%s)"; sleep 4
          mkdir -p /tmp/pw && cd /tmp/pw && npm i playwright-core@1.47.2 >/dev/null
          cat > s.js <<'J'
          const {chromium}=require('/tmp/pw/node_modules/playwright-core');const W=process.env.GITHUB_WORKSPACE+'/tmp-upload/shot/';const fs=require('fs');const log=s=>fs.appendFileSync(W+'t.txt',s+'\n');
          (async()=>{const b=await chromium.launch({executablePath:'/usr/bin/google-chrome'});
          const ctx=await b.newContext({viewport:{width:390,height:844},deviceScaleFactor:2});
          const p=await ctx.newPage();const e=[];p.on('pageerror',x=>e.push(x.message));
          p.on('response',r=>{if(r.url().includes('n8n.'))r.text().then(t=>log('n8n '+r.status()+' '+t)).catch(()=>{});});
          await p.goto('https://byd-makassar.id/model/byd-atto-1/?gclid=TESTCLAUDE&gad_campaignid=23796478693&v='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(2500);
          await p.goto('https://byd-makassar.id/simulasi-kredit/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});await p.waitForTimeout(2000);
          await p.evaluate(()=>{document.querySelectorAll('a[href*="wa.me"]').forEach(a=>a.addEventListener('click',ev=>ev.preventDefault()))});
          const a=await p.$('a[href*="wa.me"]');
          if(a){await a.evaluate(x=>x.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})));log('WA: '+decodeURIComponent(await a.getAttribute('href')));}
          log('form: '+!!(await p.$('#awi-lead-f')));
          const f=await p.$('#awi-lead');if(f){await f.scrollIntoViewIfNeeded();await p.waitForTimeout(800);await f.screenshot({path:W+'form.png'});
            await p.waitForTimeout(3500);await p.fill('#awi-lead-f input[name=nama]','Bot Test');await p.fill('#awi-lead-f input[name=wa]','081234567890');
            await p.evaluate(()=>{document.querySelector('#awi-lead-f input[name=website]').value='honeypot';});
            await p.click('#awi-lead-f button');await p.waitForTimeout(4000);log('after submit ok-visible: '+await p.isVisible('#awi-lead-ok')+' msg: '+await p.textContent('#awi-lead-m'));}
          log('errs '+JSON.stringify(e));
          await b.close()})();
          J
          node s.js || true
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
