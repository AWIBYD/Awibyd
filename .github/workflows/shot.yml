name: Shot
on:
  push:
    paths: ['tmp-upload/shot-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/shot
          curl -s -o /dev/null --max-time 30 "https://byd-makassar.id/?awi_purge=ea25bc517ab6c5a7&x=$(date +%s)"; sleep 4
          U="https://byd-makassar.id/byd-atto-1-vs-toyota-raize-vs-honda-brio-makassar/"
          curl -s -o /tmp/p.html -w "%{http_code}\n" "$U?v=$(date +%s)" >> tmp-upload/shot/t.txt
          grep -o -E '<title>[^<]*</title>|<meta name="description"[^>]*>|"FAQPage"|id="awi-cmp3"|og:image" content="[^"]*"|<h1|awi-sales-byd-makassar-avatar' /tmp/p.html | sort | uniq -c >> tmp-upload/shot/t.txt
          for s in model/byd-atto-1/ atto-1-vs-brio-makassar/; do echo "== $s" >> tmp-upload/shot/t.txt; curl -s "https://byd-makassar.id/$s?v=$(date +%s)" | grep -c "byd-atto-1-vs-toyota-raize-vs-honda-brio-makassar" >> tmp-upload/shot/t.txt; done
          mkdir -p /tmp/pw && cd /tmp/pw && npm i playwright-core@1.47.2 >/dev/null
          cat > s.js <<'J'
          const {chromium}=require('/tmp/pw/node_modules/playwright-core');const W=process.env.GITHUB_WORKSPACE+'/tmp-upload/shot/';
          (async()=>{const b=await chromium.launch({executablePath:'/usr/bin/google-chrome'});
          const p=await b.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});const e=[];p.on('pageerror',x=>e.push(x.message));
          await p.goto('https://byd-makassar.id/byd-atto-1-vs-toyota-raize-vs-honda-brio-makassar/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});await p.waitForTimeout(1500);
          const r=await p.evaluate(()=>[document.documentElement.scrollWidth,innerWidth,(document.getElementById('c3o')||{}).innerText||'none']);
          require('fs').appendFileSync(W+'t.txt','live: '+JSON.stringify(r)+' errs='+JSON.stringify(e)+'\n');
          const c=await p.$('#awi-cmp3');if(c){await c.scrollIntoViewIfNeeded();await p.waitForTimeout(800);await c.screenshot({path:W+'calc.png'});}
          await b.close()})();
          J
          node s.js || true
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot; git commit -m shot; git push
