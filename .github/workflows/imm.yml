name: Ambil Gambar
on:
  push:
    paths: ['tmp-upload/imm/trigger.txt']
permissions:
  contents: write
jobs:
  g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q pillow
          python tmp-upload/imm/get.py
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/imm; git commit -m imm; git push
