name: Haka
on:
  push:
    paths: ['tmp-upload/haka-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/haka
          npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node tmp-upload/haka.js || true
          rm -rf node_modules package.json package-lock.json
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/haka; git commit -m haka; git push
