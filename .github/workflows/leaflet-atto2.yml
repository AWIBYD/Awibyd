name: Pecah leaflet Atto 2
on:
  push:
    paths:
      - 'tmp-upload/atto2-trigger.txt'
permissions:
  contents: write
jobs:
  pecah:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unduh leaflet resmi BYD
        run: |
          mkdir -p tmp-upload/atto2
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36"
          for u in "https://www.byd.com/content/dam/byd-site/vn/proudct-specs/view_Leaflet_BYD_ATTO2_EV.pdf" "https://prod.byd.com/material/byd-site/byd-uk/specifications/ATTO%202%20EV%20UK%20Leaflet.pdf" "https://www.byd.com/material/byd-site/se/pdfs/ATTO%202-0326-BPS-SWE-20260317.pdf"; do
            curl -sSL --max-time 300 -A "$UA" -H "Accept: application/pdf,*/*" -o /tmp/l.pdf "$u" || true
            echo "$u -> $(file -b /tmp/l.pdf) $(stat -c%s /tmp/l.pdf)" >> tmp-upload/atto2/download-log.txt
            if file /tmp/l.pdf | grep -q PDF; then echo "OK $u" >> tmp-upload/atto2/download-log.txt; break; fi
          done
          cat tmp-upload/atto2/download-log.txt
      - name: Pasang alat
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick > /dev/null
      - name: Render & ekstrak
        continue-on-error: true
        run: |
          OUT=tmp-upload/atto2
          mkdir -p $OUT/hi $OUT/img
          pdfinfo /tmp/l.pdf > $OUT/info.txt
          pdftotext -layout /tmp/l.pdf $OUT/text.txt
          pdftoppm -r 200 -jpeg -jpegopt quality=90 /tmp/l.pdf $OUT/hi/p
          pdfimages -list /tmp/l.pdf > $OUT/images-list.txt
          mkdir -p /tmp/raw && pdfimages -all /tmp/l.pdf /tmp/raw/x
          for f in /tmp/raw/*; do
            w=$(identify -format '%w' "$f[0]" 2>/dev/null || echo 0)
            if [ "$w" -ge 400 ]; then b=$(basename "$f"); b=${b%.*}; convert "$f[0]" -resize '1800x1800>' -quality 88 $OUT/img/$b.jpg || true; fi
          done
          du -sh $OUT; ls $OUT/hi; ls $OUT/img | wc -l
      - name: Simpan
        if: always()
        run: |
          git config user.name "awi-bot"; git config user.email "actions@users.noreply.github.com"
          git add tmp-upload/atto2; git commit -m "leaflet atto 2" || echo nothing; git push
