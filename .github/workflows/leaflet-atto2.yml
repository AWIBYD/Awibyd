name: Pecah leaflet Atto 2
on:
  push:
    paths:
      - 'tmp-upload/atto2-trigger.txt'
permissions:
  contents: write
jobs:
  pecah:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unduh leaflet resmi BYD
        run: |
          curl -sSL --max-time 300 -A "Mozilla/5.0" -o /tmp/l.pdf "https://www.byd.com/content/dam/byd-site/vn/proudct-specs/view_Leaflet_BYD_ATTO2_EV.pdf"
          ls -la /tmp/l.pdf; file /tmp/l.pdf
      - name: Pasang alat
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick > /dev/null
      - name: Render & ekstrak
        run: |
          set -e
          OUT=tmp-upload/atto2
          mkdir -p $OUT/hi $OUT/img
          pdfinfo /tmp/l.pdf > $OUT/info.txt
          pdftotext -layout /tmp/l.pdf $OUT/text.txt
          pdftoppm -r 200 -jpeg -jpegopt quality=90 /tmp/l.pdf $OUT/hi/p
          pdfimages -list /tmp/l.pdf > $OUT/images-list.txt
          mkdir -p /tmp/raw && pdfimages -all /tmp/l.pdf /tmp/raw/x
          for f in /tmp/raw/*; do
            w=$(identify -format '%w' "$f[0]" 2>/dev/null || echo 0)
            if [ "$w" -ge 400 ]; then b=$(basename "$f"); b=${b%.*}; convert "$f[0]" -resize '1800x1800>' -quality 88 $OUT/img/$b.jpg || true; fi
          done
          du -sh $OUT; ls $OUT/hi; ls $OUT/img | wc -l
      - name: Simpan
        run: |
          git config user.name "awi-bot"; git config user.email "actions@users.noreply.github.com"
          git add tmp-upload/atto2; git commit -m "leaflet atto 2" || echo nothing; git push
