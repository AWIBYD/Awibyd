name: Scan Ti7
on:
  push:
    paths:
      - 'tmp-upload/ti7-trigger.txt'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Playwright scan
        continue-on-error: true
        run: |
          rm -rf tmp-upload/ti7; mkdir -p tmp-upload/ti7
          npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node tmp-upload/ti7-scan.js
          cat tmp-upload/ti7/scan.json | head -c 4000
      - name: Unduh gambar terbesar
        continue-on-error: true
        run: |
          mkdir -p tmp-upload/ti7/img
          python3 - <<'P'
          import json,subprocess,hashlib
          d=json.load(open('tmp-upload/ti7/scan.json'))
          items=sorted(d['imgs'].items(),key=lambda x:-x[1])[:40]
          for i,(u,s) in enumerate(items):
              if s<60000: continue
              subprocess.run(['curl','-sSL','--max-time','60','-A','Mozilla/5.0','-o',f'tmp-upload/ti7/img/i{i:02d}','--',u])
              open('tmp-upload/ti7/img/urls.txt','a').write(f'i{i:02d} {s} {u}\n')
          P
          cd tmp-upload/ti7/img && for f in i*; do [ -f "$f" ] && (file "$f" | cut -c1-90); done
      - name: Simpan
        if: always()
        run: |
          rm -rf node_modules package.json package-lock.json
          git config user.name "awi-bot"; git config user.email "actions@users.noreply.github.com"
          git add tmp-upload/ti7; git commit -m "scan ti7" || echo nothing; git pull --rebase -q; git push
