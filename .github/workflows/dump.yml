name: Dump
on:
  push:
    paths: ['tmp-upload/dump-trigger.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/dump; cd tmp-upload/dump
          UA='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 Chrome/129 Mobile Safari/537.36'
          curl -s -A "$UA" "https://byd-makassar.id/model/byd-ti7/?nc=$(date +%s)" -o model.html
          python3 - <<'PY' > imgs.txt
          import re
          h=open('model.html').read()
          i=h.find('6 Fitur Utama'); seg=h[i:i+16000]
          for m in re.finditer(r'<img[^>]*>',seg): print(m.group(0)); print()
          for m in re.finditer(r'<noscript>.*?</noscript>',seg[:9000]): print('NS',m.group(0)[:300])
          PY
          for f in dm-p-performa-110kw-360kw suspensi-disus-c multi-terrain-mode-pasir leopard-u-turn-360 v2l-camping-flyer adas-tire-burst-assist; do
            for u in "https://byd-makassar.id/wp-content/uploads/2026/11/byd-titan-7-dm-$f.webp"; do curl -s -A "$UA" -o /dev/null -w "$f %{http_code} %{content_type} %{size_download}\n" "$u"; done
          done >> imgs.txt
          grep -c 'data-lazyloaded' model.html >> imgs.txt || true
      - run: |
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/dump; git commit -m dump; git push
