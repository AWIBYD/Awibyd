name: Transkrip
on:
  push:
    paths: ['tmp-upload/song/trigger.txt']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q faster-whisper==1.0.3
          mkdir -p tmp-upload/shot; python tmp-upload/song/tr.py
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          git add tmp-upload/shot/tr.json; git commit -m tr; git push
