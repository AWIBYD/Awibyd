name: Ambil slide
on:
  push:
    paths:
      - 'tmp-upload/slide-trigger.txt'
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/slide; cd tmp-upload/slide
          B=https://byd-makassar.id/wp-content/uploads
          for p in 2025/11/Untitled-design-55.jpg 2025/11/WhatsApp-Image-2026-05-18-at-13.33.55.jpeg 2025/11/WhatsApp-Image-2026-05-18-at-13.34.01.jpeg 2025/11/WhatsApp-Image-2026-05-18-at-13.34.02.jpeg 2025/11/WhatsApp-Image-2026-05-18-at-13.34.04.jpeg 2025/11/WhatsApp-Image-2026-05-18-at-13.34.09.jpeg; do
            curl -sSL -A "Mozilla/5.0" -o "$(echo $p | tr / _)" "$B/$p"
          done
          curl -sSL -A "Mozilla/5.0" -o galeri.html "https://byd-makassar.id/wp-json/wp/v2/media?search=WhatsApp&per_page=100&_fields=source_url"
          grep -oE 'https://byd-makassar.id/wp-content/uploads/[^"'"'"' ]+\.(webp|jpg|jpeg|png)' galeri.html | sort -u > wa-imgs.txt
          ls -la; wc -l wa-imgs.txt
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          cd ../..; git add tmp-upload/slide; git commit -m slide; git push
