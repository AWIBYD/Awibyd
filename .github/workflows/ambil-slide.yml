name: Ambil slide
on:
  push:
    paths:
      - 'tmp-upload/slide-trigger.txt'
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-upload/slide; cd tmp-upload/slide
          B=https://byd-makassar.id/wp-content/uploads
          for p in 2025/11/byd-slide-1.webp 2025/11/byd-slide-2.webp 2025/11/byd-slide-3.webp 2025/11/byd-slide-4-2.webp 2025/11/byd-slide-5.webp 2025/11/byd-slide-.webp 2025/11/byd-slide-4-1.webp 2025/11/byd-slide.webp 2025/11/byd-slide-4.webp 2026/10/serah-terima-byd-m6-capt-seat-sophian-liady-20261030.jpg 2026/10/serah-terima-byd-m6-capt-saet-nur-nikma-20261030.jpg 2026/10/serah-terima-byd-atto-1-dynamic-taqwa-20261030.jpg; do
            curl -sSL -A "Mozilla/5.0" -o "$(echo $p | tr / _)" "$B/$p"
          done
          curl -sSL -A "Mozilla/5.0" -o testimoni.html https://byd-makassar.id/testimoni/
          grep -oE 'https://byd-makassar.id/wp-content/uploads/[^"'"'"' ]+\.(webp|jpg|jpeg|png)' testimoni.html | sort -u > testi-imgs.txt
          ls -la; wc -l testi-imgs.txt
          git config user.name awi-bot; git config user.email actions@users.noreply.github.com
          cd ../..; git add tmp-upload/slide; git commit -m slide; git push
