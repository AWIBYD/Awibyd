name: Pecah brosur Atto 1 2026
on:
  push:
    paths:
      - 'tmp-upload/brosur-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pecah:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unduh brosur dari n8n
        run: |
          curl -sSL --max-time 600 -o /tmp/b.pdf "https://n8n.srv1955808.hstgr.cloud/webhook/awi-brosur-atto1-7f3k9q2x"
          ls -la /tmp/b.pdf
          file /tmp/b.pdf
      - name: Pasang alat
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick > /dev/null
      - name: Render halaman & ekstrak gambar
        run: |
          set -e
          OUT=tmp-upload/a1ckd
          mkdir -p $OUT/pages $OUT/img
          pdfinfo /tmp/b.pdf > $OUT/info.txt
          pdftotext -layout /tmp/b.pdf $OUT/text.txt
          pdftoppm -r 110 -jpeg -jpegopt quality=82 /tmp/b.pdf $OUT/pages/p
          mkdir -p /tmp/raw && pdfimages -list /tmp/b.pdf > $OUT/images-list.txt
          pdfimages -all /tmp/b.pdf /tmp/raw/x
          for f in /tmp/raw/*; do
            w=$(identify -format '%w' "$f[0]" 2>/dev/null || echo 0)
            if [ "$w" -ge 500 ]; then
              b=$(basename "$f"); b=${b%.*}
              convert "$f[0]" -colorspace sRGB -resize '1800x1800>' -quality 85 $OUT/img/$b.jpg || true
            fi
          done
          du -sh $OUT; ls $OUT/pages | wc -l; ls $OUT/img | wc -l
      - name: Simpan ke repo
        run: |
          git config user.name "awi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tmp-upload/a1ckd
          git commit -m "brosur atto 1 2026 dipecah" || echo nothing
          git push
